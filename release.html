<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Release Deployment - Pridebook Version Tracker</title>
  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      font-family: var(--font-family);
      background-color: #0b0f19;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Auth Gate Screen */
    .auth-gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-gate-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
      animation: gateCardIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes gateCardIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .header-bar {
      position: sticky;
      top: 0;
      z-index: 1020;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1f2937;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .nav-tabs .nav-link {
      color: #9ca3af;
      font-weight: 600;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 18px;
      transition: all 0.2s;
    }
    .nav-tabs .nav-link:hover {
      color: #f9fafb;
      border-bottom-color: rgba(59, 130, 246, 0.5);
    }
    .nav-tabs .nav-link.active {
      color: #3b82f6;
      background: transparent;
      border-bottom-color: #3b82f6;
    }

    /* Cards matching project palette */
    .card {
      background-color: #0f172a !important;
      border: 1px solid #1e293b !important;
      border-radius: 14px;
    }
    .card-header {
      background: transparent !important;
      border-bottom: 1px solid #1e293b !important;
    }
    .card-footer {
      background: transparent !important;
      border-top: 1px solid #1e293b !important;
    }

    .form-control, .form-select {
      background-color: #090d16 !important;
      border-color: #1e293b !important;
      color: #f9fafb !important;
    }
    .form-control:focus, .form-select:focus {
      background-color: #090d16 !important;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.2) !important;
      color: #f9fafb !important;
    }
    .input-group-text {
      background-color: #090d16 !important;
      border-color: #1e293b !important;
      color: #94a3b8 !important;
    }

    /* Card state border accents */
    .card.border-primary {
      border-color: #3b82f6 !important;
    }
    .card.border-success {
      border-color: #10b981 !important;
    }
    .card.border-danger {
      border-color: #ef4444 !important;
    }

    /* Awaiting Deployment Trigger Step Box (Matches Project) */
    .step-box {
      background-color: #090d16 !important;
      border: 1px solid #1e293b !important;
      border-radius: 10px;
      color: #94a3b8;
    }

    /* Table Container and Styling (Matches Project) */
    .table-responsive {
      background: #0f172a !important;
      border: 1px solid #1e293b !important;
      border-radius: 12px;
      overflow-x: auto;
    }
    .project-table {
      width: 100%;
      border-collapse: collapse;
      background: #0f172a;
      color: #f8fafc;
      margin-bottom: 0;
      font-size: 0.88rem;
    }
    .project-table th {
      background: #090d16 !important;
      padding: 14px 18px;
      color: #94a3b8 !important;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #1e293b !important;
      border-top: none !important;
      white-space: nowrap;
    }
    .project-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b !important;
      color: #f8fafc !important;
      background: transparent !important;
      vertical-align: middle;
    }
    .project-table tbody tr:hover td {
      background-color: #1e293b !important;
    }
    .project-table tr:last-child td {
      border-bottom: none !important;
    }

    /* Status Badges & Client Tag matching project */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.73rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .status-badge.success {
      background: rgba(16, 185, 129, 0.12);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .status-badge.pending {
      background: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .status-badge.failed {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .status-badge.cancelled {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .client-box-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #94a3b8;
      background: #090d16;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, monospace;
      letter-spacing: 0.03em;
    }

    .stack-avatar {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
    }
    .stack-avatar.f {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .stack-avatar.b {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }
    .pulse-badge {
      animation: pulseAnim 1.6s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }
    .timer-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1090;
    }
  </style>
</head>
<body>

  <!-- ======================================================== -->
  <!-- AUTHENTICATION GATE SCREEN (Tamper-proof Login Gate)      -->
  <!-- ======================================================== -->
  <div id="authGate" class="auth-gate-overlay">
    <div class="auth-gate-card">
      <div class="brand-logo mb-3 mx-auto">PB</div>
      <h4 class="fw-bold text-light mb-3">
        <i class="bi bi-shield-lock-fill text-primary me-2"></i>Pride Login
      </h4>

      <div class="alert alert-danger d-none py-2 small mb-3 text-start" id="authGateAlert"></div>

      <form id="authGateForm" onsubmit="event.preventDefault(); submitAuthGate();">
        <div class="mb-3 text-start">
          <label class="form-label text-secondary small fw-bold">Username</label>
          <div class="input-group">
            <span class="input-group-text text-secondary">
              <i class="bi bi-person-fill"></i>
            </span>
            <input
              type="text"
              class="form-control"
              id="authGateUser"
              value="pridebook"
              placeholder="Enter username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label text-secondary small fw-bold">Password</label>
          <div class="input-group">
            <span class="input-group-text text-secondary">
              <i class="bi bi-key-fill"></i>
            </span>
            <input
              type="password"
              class="form-control"
              id="authGatePass"
              placeholder="Enter password"
              autocomplete="current-password"
              required
              autofocus
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm" id="authGateSubmitBtn">
          Login
        </button>

        <div class="mt-3">
          <a href="/" class="text-secondary small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- RELEASE APP CONTAINER (Empty in DOM until authenticated!)  -->
  <!-- ======================================================== -->
  <div id="releaseAppContainer" style="display: none;">
    <!-- Injected dynamically ONLY after valid authentication -->
  </div>

  <!-- Toast Container -->
  <div class="toast-container">
    <div id="liveToast" class="toast align-items-center text-bg-dark border-secondary-subtle shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-semibold" id="toastMessage"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Security & Auth State
    let isSessionAuthenticated = false;
    let tamperObserver = null;
    let tamperCheckInterval = null;
    let currentAuthToken = sessionStorage.getItem('pride_token') || '';
    let currentAuthUser = sessionStorage.getItem('pride_deploy_user') || 'pridebook';

    // 1-Hour Session Expiration State
    let sessionTimeoutTimer = null;
    let sessionCheckHeartbeat = null;
    let sessionExpiresAt = parseInt(sessionStorage.getItem('pride_expires_at') || '0', 10);

    // Deployment tracking state
    let activePollTimer = null;
    let timerInterval = null;
    let deployStartTime = 0;
    let cardTimers = {
      frontend: { finished: false, total: '00:00:00' },
      backend: { finished: false, total: '00:00:00' }
    };

    let currentClient = '';
    let currentFrontendTag = '';
    let currentBackendTag = '';
    let currentActiveRunIds = { frontend: null, backend: null };

    let bsToast = null;

    document.addEventListener('DOMContentLoaded', () => {
      bsToast = new bootstrap.Toast(document.getElementById('liveToast'), { delay: 4500 });
      checkInitialAuth();
    });

    // ------------------------------------------------------------------------
    // 1-Hour Session Management
    // ------------------------------------------------------------------------
    function startOneHourSessionTimer(expiresInSeconds = 3600) {
      if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
      if (sessionCheckHeartbeat) clearInterval(sessionCheckHeartbeat);

      sessionExpiresAt = Date.now() + (expiresInSeconds * 1000);
      sessionStorage.setItem('pride_expires_at', sessionExpiresAt.toString());

      sessionTimeoutTimer = setTimeout(() => {
        onSessionExpired();
      }, expiresInSeconds * 1000);

      // Check every 5 seconds for tab sleep or clock jump
      sessionCheckHeartbeat = setInterval(() => {
        if (isSessionAuthenticated && Date.now() >= sessionExpiresAt) {
          clearInterval(sessionCheckHeartbeat);
          onSessionExpired();
        }
      }, 5000);
    }

    function onSessionExpired() {
      if (!isSessionAuthenticated) return;
      isSessionAuthenticated = false;
      if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
      if (sessionCheckHeartbeat) clearInterval(sessionCheckHeartbeat);

      // Clear token
      sessionStorage.removeItem('pride_token');
      sessionStorage.removeItem('pride_expires_at');
      currentAuthToken = '';

      showReauthModal();
    }

    function showReauthModal() {
      let modalEl = document.getElementById('reauthGate');
      if (!modalEl) {
        modalEl = document.createElement('div');
        modalEl.id = 'reauthGate';
        modalEl.className = 'auth-gate-overlay';
        document.body.appendChild(modalEl);
      }

      modalEl.innerHTML = `
        <div class="auth-gate-card">
          <div class="brand-logo mb-3 mx-auto">PB</div>
          <h4 class="fw-bold text-light mb-2">
            <i class="bi bi-shield-lock-fill text-primary me-2"></i>Pride Login
          </h4>
          <p class="text-warning small mb-3" style="font-size: 0.85rem;">
            <i class="bi bi-clock-history me-1"></i> Your 1-hour session has expired. Please enter password to continue.
          </p>

          <div class="alert alert-danger d-none py-2 small mb-3 text-start" id="reauthAlert"></div>

          <form id="reauthForm" onsubmit="event.preventDefault(); submitReauth();">
            <div class="mb-3 text-start">
              <label class="form-label text-secondary small fw-bold">Username</label>
              <div class="input-group">
                <span class="input-group-text text-secondary">
                  <i class="bi bi-person-fill"></i>
                </span>
                <input
                  type="text"
                  class="form-control"
                  id="reauthUser"
                  value="${escapeHtml(currentAuthUser || 'pridebook')}"
                  readonly
                  style="background-color: #090d16 !important; cursor: not-allowed;"
                />
              </div>
            </div>

            <div class="mb-4 text-start">
              <label class="form-label text-secondary small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text text-secondary">
                  <i class="bi bi-key-fill"></i>
                </span>
                <input
                  type="password"
                  class="form-control"
                  id="reauthPass"
                  placeholder="Enter password"
                  autocomplete="current-password"
                  required
                  autofocus
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm" id="reauthSubmitBtn">
              Login
            </button>

            <div class="mt-3">
              <a href="/" class="text-secondary small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
              </a>
            </div>
          </form>
        </div>
      `;

      modalEl.style.display = 'flex';
      modalEl.style.opacity = '1';

      setTimeout(() => {
        const passInp = document.getElementById('reauthPass');
        if (passInp) passInp.focus();
      }, 50);

      startTamperDefenseForElement(modalEl);
    }

    async function submitReauth() {
      const user = document.getElementById('reauthUser').value.trim() || currentAuthUser || 'pridebook';
      const pass = document.getElementById('reauthPass').value.trim();
      const alertEl = document.getElementById('reauthAlert');
      const submitBtn = document.getElementById('reauthSubmitBtn');

      if (!pass) {
        alertEl.textContent = 'Please enter your password.';
        alertEl.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Login...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid credentials');
        }

        // Re-authenticated!
        isSessionAuthenticated = true;
        stopTamperDefense();

        currentAuthUser = data.username || user;
        currentAuthToken = data.token;
        sessionStorage.setItem('pride_token', data.token);
        sessionStorage.setItem('pride_deploy_user', currentAuthUser);

        const modalEl = document.getElementById('reauthGate');
        if (modalEl) {
          modalEl.style.transition = 'opacity 0.2s ease';
          modalEl.style.opacity = '0';
          setTimeout(() => modalEl.remove(), 200);
        }

        // Restart 1-hour session timer
        startOneHourSessionTimer(data.expiresIn || 3600);
        showToast('Session renewed for 1 hour. You can continue deployments!');
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Login';
      }
    }

    // ------------------------------------------------------------------------
    // Tamper Defense System (Blocks Dev Console / Element inspection tampering)
    // ------------------------------------------------------------------------
    function startTamperDefense() {
      const gate = document.getElementById('authGate');
      if (gate) startTamperDefenseForElement(gate);
    }

    function startTamperDefenseForElement(gateEl) {
      stopTamperDefense();

      tamperObserver = new MutationObserver(() => {
        if (isSessionAuthenticated) return;
        if (!document.contains(gateEl)) {
          triggerTamperLockdown('Login popup removed from DOM');
          return;
        }

        const comp = window.getComputedStyle(gateEl);
        if (
          comp.display === 'none' ||
          comp.visibility === 'hidden' ||
          parseFloat(comp.opacity) < 0.1 ||
          gateEl.hidden ||
          gateEl.offsetWidth === 0 ||
          gateEl.offsetHeight === 0
        ) {
          triggerTamperLockdown('Login popup hidden via DevTools');
          return;
        }
      });

      tamperObserver.observe(document.body, { childList: true, subtree: true, attributes: true });
      tamperObserver.observe(gateEl, { attributes: true, attributeFilter: ['style', 'class', 'hidden'] });

      tamperCheckInterval = setInterval(() => {
        if (isSessionAuthenticated) {
          clearInterval(tamperCheckInterval);
          return;
        }
        if (!document.contains(gateEl)) {
          triggerTamperLockdown('Login popup node removed');
          return;
        }
        const comp = window.getComputedStyle(gateEl);
        if (
          comp.display === 'none' ||
          comp.visibility === 'hidden' ||
          parseFloat(comp.opacity) < 0.1 ||
          gateEl.offsetWidth === 0 ||
          gateEl.offsetHeight === 0
        ) {
          triggerTamperLockdown('Login popup hidden');
          return;
        }
      }, 250);
    }

    function stopTamperDefense() {
      if (tamperObserver) {
        tamperObserver.disconnect();
        tamperObserver = null;
      }
      if (tamperCheckInterval) {
        clearInterval(tamperCheckInterval);
        tamperCheckInterval = null;
      }
    }

    function triggerTamperLockdown(reason) {
      if (isSessionAuthenticated) return;
      stopTamperDefense();

      const container = document.getElementById('releaseAppContainer');
      if (container) container.innerHTML = '';
      document.body.innerHTML = `
        <div style="background:#0b0f19;color:#ef4444;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:20px;">
          <h2 style="font-weight:700;margin-bottom:10px;">Security Lockout</h2>
          <p style="color:#9ca3af;max-width:500px;margin-bottom:20px;">
            Unauthorized DevTools tampering detected (${escapeHtml(reason)}). Access is denied. Redirecting to dashboard...
          </p>
        </div>
      `;
      setTimeout(() => {
        window.location.replace('/');
      }, 700);
    }

    // ------------------------------------------------------------------------
    // Authentication Validation Flow
    // ------------------------------------------------------------------------
    async function checkInitialAuth() {
      if (currentAuthToken) {
        try {
          const res = await fetch('/api/auth/verify', {
            headers: { 'Authorization': `Bearer ${currentAuthToken}` }
          });
          const data = await res.json();
          if (res.ok && data.authenticated) {
            onAuthSuccess(data.username || currentAuthUser, currentAuthToken, data.expiresIn || 3600);
            return;
          }
        } catch (_) {}
      }

      startTamperDefense();
    }

    async function submitAuthGate() {
      const user = document.getElementById('authGateUser').value.trim();
      const pass = document.getElementById('authGatePass').value.trim();
      const alertEl = document.getElementById('authGateAlert');
      const submitBtn = document.getElementById('authGateSubmitBtn');

      if (!user || !pass) {
        alertEl.textContent = 'Please enter both username and password.';
        alertEl.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Login...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid credentials');
        }

        onAuthSuccess(data.username || user, data.token, data.expiresIn || 3600);
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Login';
      }
    }

    function onAuthSuccess(user, token, expiresIn = 3600) {
      isSessionAuthenticated = true;
      stopTamperDefense();

      currentAuthUser = user;
      currentAuthToken = token;
      sessionStorage.setItem('pride_token', token);
      sessionStorage.setItem('pride_deploy_user', user);

      // Start 1-hour session timer
      startOneHourSessionTimer(expiresIn);

      // Fade out gate and mount release DOM
      const gate = document.getElementById('authGate');
      if (gate) {
        gate.style.transition = 'opacity 0.25s ease';
        gate.style.opacity = '0';
        setTimeout(() => gate.remove(), 250);
      }

      mountReleaseApp(user);
    }

    function logout() {
      sessionStorage.removeItem('pride_token');
      sessionStorage.removeItem('pride_deploy_user');
      sessionStorage.removeItem('pride_expires_at');
      document.cookie = 'pride_auth=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
      const container = document.getElementById('releaseAppContainer');
      if (container) container.innerHTML = '';
      window.location.replace('/');
    }

    // ------------------------------------------------------------------------
    // Mount Release UI into DOM (Only when authenticated)
    // ------------------------------------------------------------------------
    function mountReleaseApp(user) {
      const container = document.getElementById('releaseAppContainer');
      container.style.display = 'block';
      container.innerHTML = `
        <!-- Header Navigation -->
        <header class="header-bar py-2 px-3 mb-4">
          <div class="container-xxl d-flex align-items-center justify-content-between flex-wrap gap-2">
            <a href="/" class="d-flex align-items-center gap-3 text-decoration-none text-light">
              <div class="brand-logo">PB</div>
              <div>
                <div class="fw-bold fs-5 lh-1">Pridebook Version Tracker</div>
                <small class="text-secondary" style="font-size: 0.75rem;">Client Deployments &amp; Release Control</small>
              </div>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap">

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const cfg = await res.json();
          const badge = document.getElementById('dbTypeBadge');
          if (badge) badge.innerHTML = `<i class="bi bi-database me-1"></i> DB: ${cfg.dbType || 'Connected'}`;
        }
      } catch (_) {}
    }

    async function fetchTags() {
      try {
        const res = await fetch('/api/deploy/tags');
        if (!res.ok) return;
        const data = await res.json();
        if (data.tags) {
          const fList = document.getElementById('frontendTagsList');
          const bList = document.getElementById('backendTagsList');
          if (!fList || !bList) return;
          fList.innerHTML = '';
          bList.innerHTML = '';

          (data.tags.frontend || []).forEach(tag => {
            const opt = document.createElement('option');
            opt.value = tag;
            fList.appendChild(opt);
          });
          (data.tags.backend || []).forEach(tag => {
            const opt = document.createElement('option');
            opt.value = tag;
            bList.appendChild(opt);
          });
        }
      } catch (e) {
        console.warn('Failed to fetch tags:', e);
      }
    }

    function onInputsChanged() {
      const clientEl = document.getElementById('targetClient');
      const fValEl = document.getElementById('frontendVersion');
      const bValEl = document.getElementById('backendVersion');
      if (!clientEl || !fValEl || !bValEl) return;

      const client = clientEl.value;
      const fVal = fValEl.value.trim();
      const bVal = bValEl.value.trim();

      const fCT = document.getElementById('frontendClientTxt');
      const bCT = document.getElementById('backendClientTxt');
      const fVT = document.getElementById('frontendVersionTxt');
      const bVT = document.getElementById('backendVersionTxt');

      if (fCT) fCT.textContent = client;
      if (bCT) bCT.textContent = client;
      if (fVT) fVT.textContent = fVal || '-';
      if (bVT) bVT.textContent = bVal || '-';

      hideDeployabilityAlert();

      if (client !== 'stage' && (fVal || bVal)) {
        checkDeployabilityRealtime(client, fVal, bVal);
      }
    }

    async function checkDeployabilityRealtime(client, fTag, bTag) {
      try {
        const url = `/api/deploy/validate?client=${encodeURIComponent(client)}&frontend_tag=${encodeURIComponent(fTag)}&backend_tag=${encodeURIComponent(bTag)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const warnings = [];
          if (fTag && data.frontend && !data.frontend.deployable) {
            warnings.push(data.frontend.message);
          }
          if (bTag && data.backend && !data.backend.deployable) {
            warnings.push(data.backend.message);
          }
          if (warnings.length > 0) {
            showDeployabilityAlert(warnings.join('<br>'));
          } else {
            hideDeployabilityAlert();
          }
        }
      } catch (_) {}
    }

    function showDeployabilityAlert(html) {
      const el = document.getElementById('deployabilityAlert');
      const txt = document.getElementById('deployabilityAlertText');
      if (el && txt) {
        txt.innerHTML = html;
        el.classList.remove('d-none');
      }
    }

    function hideDeployabilityAlert() {
      const el = document.getElementById('deployabilityAlert');
      const txt = document.getElementById('deployabilityAlertText');
      if (el && txt) {
        el.classList.add('d-none');
        txt.innerHTML = '';
      }
    }

    // ------------------------------------------------------------------------
    // Deploy Trigger Execution (With Loading State & Selective Stacks)
    // ------------------------------------------------------------------------
    async function onDeployClick() {
      // Check if session has expired (1 hour check)
      if (Date.now() >= sessionExpiresAt) {
        onSessionExpired();
        return;
      }

      const clientEl = document.getElementById('targetClient');
      const fTagEl = document.getElementById('frontendVersion');
      const bTagEl = document.getElementById('backendVersion');
      if (!clientEl || !fTagEl || !bTagEl) return;

      const client = clientEl.value.trim();
      const fTag = fTagEl.value.trim();
      const bTag = bTagEl.value.trim();

      if (!fTag && !bTag) {
        showToast('Please specify at least a Frontend Version or a Backend Version.', true);
        return;
      }

      currentClient = client;
      currentFrontendTag = fTag;
      currentBackendTag = bTag;

      const submitBtn = document.getElementById('deploySubmitBtn');
      if (submitBtn) submitBtn.disabled = true;
      const icon = document.getElementById('deployBtnIcon');
      if (icon) icon.className = 'spinner-border spinner-border-sm me-2';
      const text = document.getElementById('deployBtnText');
      if (text) text.textContent = 'Deploying...';

      cardTimers = {
        frontend: { finished: !currentFrontendTag, total: '00:00:00' },
        backend: { finished: !currentBackendTag, total: '00:00:00' }
      };

      if (currentFrontendTag) {
        setCardState('frontend', 'queued', {
          client: currentClient,
          tag: currentFrontendTag,
          job: 'Dispatched to GitHub Actions queue...',
          progress: 15
        });
      } else {
        setCardState('frontend', 'idle', { client: currentClient, tag: 'Skipped (No version specified)', job: 'Not selected for deployment' });
        const timerEl = document.getElementById('frontendTimerTxt');
        if (timerEl) timerEl.textContent = '00:00:00';
      }

      if (currentBackendTag) {
        setCardState('backend', 'queued', {
          client: currentClient,
          tag: currentBackendTag,
          job: 'Dispatched to GitHub Actions queue...',
          progress: 15
        });
      } else {
        setCardState('backend', 'idle', { client: currentClient, tag: 'Skipped (No version specified)', job: 'Not selected for deployment' });
        const timerEl = document.getElementById('backendTimerTxt');
        if (timerEl) timerEl.textContent = '00:00:00';
      }

      deployStartTime = Date.now();
      startActiveCountUpTimer();

      try {
        const res = await fetch('/api/deploy/trigger', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentAuthToken}`
          },
          body: JSON.stringify({
            client: currentClient,
            frontend_tag: currentFrontendTag,
            backend_tag: currentBackendTag,
            authToken: currentAuthToken
          })
        });

        const data = await res.json();
        if (res.status === 401 && data.expired) {
          onSessionExpired();
          throw new Error('Your 1-hour session has expired. Please re-authenticate.');
        }

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to dispatch deployment');
        }

        if (data.warnings && data.warnings.length > 0) {
          showDeployabilityAlert(data.warnings.join('<br>'));
          if (!data.frontend && currentFrontendTag) {
            setCardState('frontend', 'failed', {
              tag: currentFrontendTag,
              job: 'Deployment blocked: Flagged as non-deployable to client',
              progress: 0
            });
            cardTimers.frontend.finished = true;
            const tEl = document.getElementById('frontendTimerTxt');
            if (tEl) tEl.textContent = 'Blocked';
          }
          if (!data.backend && currentBackendTag) {
            setCardState('backend', 'failed', {
              tag: currentBackendTag,
              job: 'Deployment blocked: Flagged as non-deployable to client',
              progress: 0
            });
            cardTimers.backend.finished = true;
            const tEl = document.getElementById('backendTimerTxt');
            if (tEl) tEl.textContent = 'Blocked';
          }
        }

        showToast(`Release Deployment initiated for ${currentClient.toUpperCase()}!`);
        startStatusPolling();
      } catch (err) {
        showToast(err.message, true);
        showDeployabilityAlert(err.message);
        if (currentFrontendTag) setCardState('frontend', 'failed', { job: err.message, progress: 100 });
        if (currentBackendTag) setCardState('backend', 'failed', { job: err.message, progress: 100 });
        stopAndLockTimer();
        resetDeployButton();
      }
    }

    // ------------------------------------------------------------------------
    // Live Status Polling & Card Updates
    // ------------------------------------------------------------------------
    function startStatusPolling() {
      if (activePollTimer) clearInterval(activePollTimer);

      activePollTimer = setInterval(async () => {
        try {
          const url = `/api/deploy/status?client=${encodeURIComponent(currentClient)}&frontend_tag=${encodeURIComponent(currentFrontendTag)}&backend_tag=${encodeURIComponent(currentBackendTag)}`;
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();

          if (currentFrontendTag && data.frontend && !cardTimers.frontend.finished) {
            updateCardWithLiveInfo('frontend', data.frontend, currentClient, currentFrontendTag);
          }
          if (currentBackendTag && data.backend && !cardTimers.backend.finished) {
            updateCardWithLiveInfo('backend', data.backend, currentClient, currentBackendTag);
          }

          const fStatus = currentFrontendTag ? (data.frontend?.status || 'queued') : 'deployed';
          const bStatus = currentBackendTag ? (data.backend?.status || 'queued') : 'deployed';

          const isFDone = fStatus === 'deployed' || fStatus === 'failed' || fStatus === 'cancelled';
          const isBDone = bStatus === 'deployed' || bStatus === 'failed' || bStatus === 'cancelled';

          if (isFDone && !cardTimers.frontend.finished) {
            cardTimers.frontend.finished = true;
            if (currentFrontendTag) {
              const el = document.getElementById('frontendTimerTxt');
              if (el) el.textContent = `Total: ${cardTimers.frontend.total || '00:00:00'}`;
            }
          }
          if (isBDone && !cardTimers.backend.finished) {
            cardTimers.backend.finished = true;
            if (currentBackendTag) {
              const el = document.getElementById('backendTimerTxt');
              if (el) el.textContent = `Total: ${cardTimers.backend.total || '00:00:00'}`;
            }
          }

          if (isFDone && isBDone) {
            clearInterval(activePollTimer);
            if (timerInterval) clearInterval(timerInterval);
            resetDeployButton();
            fetchRecentRuns();

            if (fStatus === 'deployed' && bStatus === 'deployed') {
              showToast('Release deployment completed successfully!');
              fetch('/api/deployments?sync=true').catch(() => {});
            } else if (fStatus === 'cancelled' || bStatus === 'cancelled') {
              showToast('Deployment run was cancelled.', true);
            } else {
              showToast('Deployment finished with failures. Check GitHub run logs.', true);
            }
          }
        } catch (e) {
          console.warn('Status poll warn:', e);
        }
      }, 4000);
    }

    function updateCardWithLiveInfo(stack, info, client, tag) {
      if (!info) return;
      const status = info.status || 'queued';
      let progress = 20;
      let jobText = info.active_job || 'Processing...';

      if (info.run_id) currentActiveRunIds[stack] = info.run_id;

      if (status === 'queued') {
        progress = 25;
        jobText = 'Waiting in runner queue...';
      } else if (status === 'deploying') {
        progress = 65;
        jobText = info.active_job || 'Executing deployment containers...';
      } else if (status === 'deployed') {
        progress = 100;
        jobText = 'Completed successfully (All jobs passed)';
      } else if (status === 'failed') {
        progress = 100;
        jobText = 'Deployment failed. Check workflow logs.';
      } else if (status === 'cancelled') {
        progress = 100;
        jobText = 'Deployment cancelled by user.';
      }

      setCardState(stack, status, {
        client,
        tag,
        job: jobText,
        progress,
        run_url: info.run_url,
        run_id: info.run_id
      });
    }

    function setCardState(stack, state, opts = {}) {
      const card = document.getElementById(stack + 'Card');
      const badge = document.getElementById(stack + 'Badge');
      const spinner = document.getElementById(stack + 'Spinner');
      const clientTxt = document.getElementById(stack + 'ClientTxt');
      const versionTxt = document.getElementById(stack + 'VersionTxt');
      const jobTxt = document.getElementById(stack + 'JobTxt');
      const progress = document.getElementById(stack + 'Progress');
      const runLink = document.getElementById(stack + 'RunLink');
      const cancelBtn = document.getElementById(stack + 'CancelBtn');

      if (!card || !badge) return;

      if (opts.client && clientTxt) clientTxt.textContent = opts.client;
      if (opts.tag && versionTxt) versionTxt.textContent = opts.tag;
      if (opts.job && jobTxt) jobTxt.textContent = opts.job;
      if (opts.progress !== undefined && progress) progress.style.width = opts.progress + '%';

      if (opts.run_url && runLink) {
        runLink.href = opts.run_url;
        runLink.classList.remove('d-none');
      }

      badge.className = 'badge rounded-pill px-3 py-2';
      card.className = 'card h-100 shadow-sm border-secondary-subtle';

      if (state === 'queued') {
        badge.className = 'badge bg-warning text-dark rounded-pill px-3 py-2 pulse-badge';
        badge.textContent = 'QUEUED';
        if (spinner) spinner.classList.remove('d-none');
        if (cancelBtn) cancelBtn.classList.remove('d-none');
      } else if (state === 'deploying') {
        badge.className = 'badge bg-primary rounded-pill px-3 py-2 pulse-badge';
        badge.textContent = 'DEPLOYING';
        card.classList.add('border-primary');
        if (spinner) spinner.classList.remove('d-none');
        if (cancelBtn) cancelBtn.classList.remove('d-none');
      } else if (state === 'deployed') {
        badge.className = 'badge bg-success rounded-pill px-3 py-2';
        badge.textContent = 'DEPLOYED';
        card.classList.add('border-success');
        if (spinner) spinner.classList.add('d-none');
        if (cancelBtn) cancelBtn.classList.add('d-none');
      } else if (state === 'failed') {
        badge.className = 'badge bg-danger rounded-pill px-3 py-2';
        badge.textContent = 'FAILED';
        card.classList.add('border-danger');
        if (spinner) spinner.classList.add('d-none');
        if (cancelBtn) cancelBtn.classList.add('d-none');
      } else if (state === 'cancelled') {
        badge.className = 'badge bg-secondary rounded-pill px-3 py-2';
        badge.textContent = 'CANCELLED';
        if (spinner) spinner.classList.add('d-none');
        if (cancelBtn) cancelBtn.classList.add('d-none');
      } else {
        badge.className = 'badge bg-secondary-subtle text-secondary rounded-pill px-3 py-2';
        badge.textContent = 'IDLE';
        if (spinner) spinner.classList.add('d-none');
        if (cancelBtn) cancelBtn.classList.add('d-none');
      }
    }

    // Active Count-Up Timer (00:00:00 format)
    function startActiveCountUpTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const totalSeconds = Math.floor((Date.now() - deployStartTime) / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        const formatted = `${hours}:${minutes}:${seconds}`;

        if (currentFrontendTag && !cardTimers.frontend.finished) {
          const el = document.getElementById('frontendTimerTxt');
          if (el) el.textContent = formatted;
          cardTimers.frontend.total = formatted;
        }
        if (currentBackendTag && !cardTimers.backend.finished) {
          const el = document.getElementById('backendTimerTxt');
          if (el) el.textContent = formatted;
          cardTimers.backend.total = formatted;
        }
      }, 1000);
    }

    function stopAndLockTimer() {
      if (timerInterval) clearInterval(timerInterval);
      if (currentFrontendTag && !cardTimers.frontend.finished) {
        cardTimers.frontend.finished = true;
        const el = document.getElementById('frontendTimerTxt');
        if (el) el.textContent = `Total: ${cardTimers.frontend.total || '00:00:00'}`;
      }
      if (currentBackendTag && !cardTimers.backend.finished) {
        cardTimers.backend.finished = true;
        const el = document.getElementById('backendTimerTxt');
        if (el) el.textContent = `Total: ${cardTimers.backend.total || '00:00:00'}`;
      }
    }

    function resetDeployButton() {
      const submitBtn = document.getElementById('deploySubmitBtn');
      if (submitBtn) submitBtn.disabled = false;
      const icon = document.getElementById('deployBtnIcon');
      if (icon) icon.className = 'bi bi-send-fill me-2';
      const text = document.getElementById('deployBtnText');
      if (text) text.textContent = 'Release Deployment';
    }

    async function cancelRun(stack) {
      if (Date.now() >= sessionExpiresAt) {
        onSessionExpired();
        return;
      }

      const runId = currentActiveRunIds[stack];
      if (!runId) {
        showToast(`No active run ID found to cancel for ${stack}`, true);
        return;
      }

      const confirmed = confirm(`Are you sure you want to cancel the ${stack.toUpperCase()} deployment run #${runId}?`);
      if (!confirmed) return;

      const btn = document.getElementById(stack + 'CancelBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Cancelling...';
      }

      try {
        const res = await fetch('/api/deploy/cancel', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentAuthToken}`
          },
          body: JSON.stringify({ stack, run_id: runId })
        });

        const data = await res.json();
        if (res.status === 401 && data.expired) {
          onSessionExpired();
          throw new Error('Your 1-hour session has expired. Please re-authenticate.');
        }

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to cancel run');
        }

        showToast(`${stack.toUpperCase()} run cancellation requested!`);
        setCardState(stack, 'cancelled', { job: 'Cancellation requested...' });
      } catch (err) {
        showToast(err.message, true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-x-circle me-1"></i> Cancel Run';
        }
      }
    }

    async function fetchRecentRuns() {
      try {
        const res = await fetch('/api/deploy/recent');
        if (!res.ok) return;
        const data = await res.json();
        const tbody = document.getElementById('recentRunsBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No recent deployment runs found</td></tr>';
          return;
        }

        data.data.forEach(run => {
          const tr = document.createElement('tr');
          const isSuccess = run.conclusion === 'success';
          const isCancelled = run.conclusion === 'cancelled';
          const isFailed = run.conclusion === 'failure' || run.conclusion === 'timed_out';
          const isPending = !run.conclusion && (run.status === 'in_progress' || run.status === 'queued');

          let badgeHtml = '';
          if (isSuccess) {
            badgeHtml = `<span class="status-badge success"><span class="badge-dot"></span> SUCCESS</span>`;
          } else if (isCancelled) {
            badgeHtml = `<span class="status-badge cancelled"><span class="badge-dot"></span> CANCELLED</span>`;
          } else if (isFailed) {
            badgeHtml = `<span class="status-badge failed"><span class="badge-dot"></span> FAILED</span>`;
          } else if (isPending) {
            badgeHtml = `<span class="status-badge pending"><span class="badge-dot"></span> ${escapeHtml((run.status || 'in progress').toUpperCase())}</span>`;
          } else {
            badgeHtml = `<span class="status-badge cancelled"><span class="badge-dot"></span> ${escapeHtml((run.conclusion || run.status || 'unknown').toUpperCase())}</span>`;
          }

          tr.innerHTML = `
            <td style="padding-left: 1.25rem;">
              <a href="${run.run_url}" target="_blank" class="text-decoration-none text-light fw-bold d-inline-flex align-items-center" title="Open GitHub Actions run #${run.run_number || run.id}">
                <span class="stack-avatar ${run.stack.toLowerCase()[0]} me-2">${run.stack[0]}</span>
                <span>${escapeHtml(run.stack)}</span>
                <i class="bi bi-box-arrow-up-right ms-1 text-secondary" style="font-size: 0.72rem;"></i>
              </a>
            </td>
            <td>
              <span class="client-box-tag">
                ${escapeHtml(run.client || '-')}
              </span>
            </td>
            <td>${badgeHtml}</td>
            <td class="text-secondary small">${escapeHtml(run.actor || 'system')}</td>
            <td class="text-secondary small" style="padding-right: 1.25rem;">${formatDate(run.created_at)}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.warn('Recent runs err:', e);
      }
    }

    function formatDate(iso) {
      if (!iso) return '-';
      try {
        const d = new Date(iso);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return iso;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function showToast(msg, isError = false) {
      const toastEl = document.getElementById('liveToast');
      const toastMsg = document.getElementById('toastMessage');
      if (toastEl && toastMsg) {
        toastMsg.textContent = msg;
        toastEl.className = isError
          ? 'toast align-items-center text-bg-danger border-0 shadow'
          : 'toast align-items-center text-bg-success border-0 shadow';
        if (bsToast) bsToast.show();
      }
    }
  </script>
</body>
